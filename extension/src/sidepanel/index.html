<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shortlyst</title>
    <style>
      :root {
        --bg: #f5f6f9;
        --card-bg: #ffffff;
        --border: #e5e7eb;
        --text: #111827;
        --text-muted: #6b7280;
        --text-subtle: #9ca3af;
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --primary-soft: #eef2ff;
        --primary-contrast: #ffffff;
        --success-bg: #dcfce7;
        --success-text: #15803d;
        --warning-bg: #fef3c7;
        --warning-text: #92400e;
        --danger-bg: #fee2e2;
        --danger-text: #b91c1c;
        --danger: #dc2626;
        --danger-hover: #b91c1c;
        --radius: 12px;
        --radius-sm: 8px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
        margin: 0;
        padding: 14px;
        line-height: 1.5;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      /* ---------- Top bar ---------- */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand-mark {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: var(--primary);
        color: var(--primary-contrast);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 13px;
      }
      .brand-name {
        font-weight: 700;
        font-size: 15px;
        letter-spacing: -0.01em;
      }
      .icon-button {
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 16px;
        color: var(--text-muted);
        padding: 5px 7px;
        border-radius: var(--radius-sm);
      }
      .icon-button:hover {
        background: var(--border);
      }

      /* ---------- Generic card ---------- */
      .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
        margin-bottom: 12px;
      }

      /* ---------- Profile header ---------- */
      .profile-header {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .profile-photo,
      .profile-photo-placeholder {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        flex-shrink: 0;
        object-fit: cover;
        background: var(--primary-soft);
      }
      .profile-photo-placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary);
        font-weight: 700;
        font-size: 18px;
      }
      .profile-identity {
        min-width: 0;
      }
      .profile-name {
        font-weight: 700;
        font-size: 15px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .profile-headline {
        color: var(--text-muted);
        font-size: 12px;
        margin-top: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .profile-location {
        color: var(--text-subtle);
        font-size: 11px;
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .profile-link {
        display: inline-block;
        margin-top: 4px;
        font-size: 11px;
        color: var(--primary);
        text-decoration: none;
      }
      .profile-link:hover {
        text-decoration: underline;
      }
      .profile-empty {
        color: var(--text-subtle);
        font-style: italic;
      }

      /* ---------- Buttons ---------- */
      .primary-button,
      .secondary-button,
      .danger-button {
        width: 100%;
        padding: 9px;
        border-radius: var(--radius-sm);
        border: none;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .primary-button {
        background: var(--primary);
        color: var(--primary-contrast);
      }
      .primary-button:hover:not(:disabled) {
        background: var(--primary-hover);
      }
      .secondary-button {
        background: var(--primary-soft);
        color: var(--primary);
      }
      .secondary-button:hover:not(:disabled) {
        background: #e0e4ff;
      }
      .danger-button {
        background: #fff;
        color: var(--danger);
        border: 1px solid var(--danger);
      }
      .danger-button:hover {
        background: var(--danger-bg);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .button-row {
        display: flex;
        gap: 8px;
      }
      .link-button {
        border: none;
        background: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 12px;
        padding: 0;
        margin-top: 10px;
      }
      .link-button:hover {
        color: var(--text);
        text-decoration: underline;
      }

      /* ---------- Stepper ---------- */
      .stepper {
        margin-top: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 12px;
        color: var(--text-subtle);
      }
      .step-dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid var(--border);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 700;
        color: transparent;
      }
      .step.active .step-dot {
        border-color: var(--primary);
        background: var(--primary-soft);
        animation: pulse 1.2s ease-in-out infinite;
      }
      .step.active {
        color: var(--text);
        font-weight: 600;
      }
      .step.done .step-dot {
        border-color: var(--success-text);
        background: var(--success-text);
        color: #fff;
      }
      .step.done {
        color: var(--text-muted);
      }
      .step.error .step-dot {
        border-color: var(--danger);
        background: var(--danger-bg);
        color: var(--danger);
      }
      .step.error {
        color: var(--danger-text);
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.35);
        }
        50% {
          box-shadow: 0 0 0 4px rgba(79, 70, 229, 0);
        }
      }

      .scan-status {
        margin-top: 10px;
        font-size: 12px;
        color: var(--text-muted);
      }

      /* ---------- Section cards (About/Experience/Education/Skills) ---------- */
      .sections {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .section-card summary {
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-muted);
        list-style: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .section-card summary::-webkit-details-marker {
        display: none;
      }
      .section-card summary::after {
        content: "▾";
        color: var(--text-subtle);
        transition: transform 0.15s ease;
      }
      .section-card[open] summary::after {
        transform: rotate(180deg);
      }
      .section-body {
        margin-top: 8px;
        font-size: 12.5px;
        color: var(--text);
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 220px;
        overflow-y: auto;
      }
      .section-empty {
        color: var(--text-subtle);
        font-style: italic;
      }

      /* ---------- Field row (role picker) ---------- */
      .field-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 10px;
      }
      .field-row label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-muted);
      }
      select {
        width: 100%;
        padding: 7px 8px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--card-bg);
        font-size: 13px;
        color: var(--text);
      }

      /* ---------- Status banner ---------- */
      .status {
        background: var(--warning-bg);
        color: var(--warning-text);
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        margin: 0 0 12px;
        font-size: 12.5px;
      }
      .status.error {
        background: var(--danger-bg);
        color: var(--danger-text);
      }

      /* ---------- Result ---------- */
      .recommendation {
        display: inline-block;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.03em;
        padding: 4px 10px;
        border-radius: 999px;
        margin-bottom: 10px;
      }
      .recommendation-contact {
        background: var(--success-bg);
        color: var(--success-text);
      }
      .recommendation-maybe {
        background: var(--warning-bg);
        color: var(--warning-text);
      }
      .recommendation-reject {
        background: var(--danger-bg);
        color: var(--danger-text);
      }
      .score-row {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 10px;
      }
      .review-banner {
        background: var(--warning-bg);
        color: var(--warning-text);
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        margin-bottom: 10px;
      }
      .dimension {
        margin-bottom: 8px;
      }
      .dimension-header {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        margin-bottom: 3px;
      }
      .dimension-header .dim-name {
        color: var(--text);
        text-transform: capitalize;
      }
      .dimension-header .dim-value {
        color: var(--text-muted);
      }
      .bar-track {
        background: var(--border);
        border-radius: 999px;
        height: 6px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        border-radius: 999px;
      }

      details#raw-details summary {
        cursor: pointer;
        font-size: 12px;
        color: var(--primary);
        margin-top: 4px;
      }
      details#raw-details pre {
        margin: 8px 0 0;
        padding: 8px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 200px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand">
        <span class="brand-mark">S</span>
        <span class="brand-name">Shortlyst</span>
      </div>
      <button id="options-link" class="icon-button" title="API key settings" aria-label="Settings">⚙</button>
    </div>

    <div id="profile-header-container"></div>

    <div class="card">
      <div class="button-row">
        <button id="scan-button" class="primary-button">Scan this candidate</button>
        <button id="stop-button" class="danger-button" hidden style="width: auto; padding-inline: 14px">Stop</button>
      </div>
      <div id="stepper-container"></div>
      <p id="scan-status" class="scan-status" hidden></p>
      <button id="reset-button" class="link-button">Reset</button>
    </div>

    <div id="sections-container"></div>

    <div class="card">
      <div class="field-row">
        <label for="role-select">Role</label>
        <select id="role-select" disabled></select>
      </div>
      <button id="classify-button" class="secondary-button" disabled>Reclassify</button>
    </div>

    <p id="status" class="status" hidden></p>

    <section id="result" hidden></section>

    <script type="module" src="../../dist/sidepanel/main.js"></script>
  </body>
</html>
