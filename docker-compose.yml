services:
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-shortlyst}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-shortlyst}
      - POSTGRES_DB=${POSTGRES_DB:-shortlyst}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shortlyst}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - shortlyst_db_data:/var/lib/postgresql

volumes:
  shortlyst_db_data:
